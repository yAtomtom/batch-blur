name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint + format チェック（ローカル依存のみ使用）
      - run: npx --no-install biome ci .
      # tsc（型チェック）+ vite build
      - run: npm run build
      # vitest run
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # generate_context! は frontendDist(../dist) の存在をコンパイル時に要求する。
      # dist は gitignore 済みのビルド成果物であり、Rust の検証に中身は不要。
      - name: Create frontendDist placeholder
        working-directory: .
        run: mkdir -p dist && touch dist/index.html
      # cargo test/clippy は tauri をコンパイルするため webkit2gtk 等が必要（Tauri v2 公式手順）
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
